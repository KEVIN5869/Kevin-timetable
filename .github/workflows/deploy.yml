# 定时：跑测试 → 拉取 ics 生成网页 → 发布到 GitHub Pages
# 任何一步失败都不会发布，线上保持上一次成功的网页。
#
# 注意：GitHub 的免费定时任务很不准，实际常常 3–6 小时才跑一次。
# 网页上超过 12 小时没更新会显示橙色提醒。
name: 更新课表

on:
  schedule:
    # 每小时第 7、27、47 分钟。避开整点（整点前后 GitHub 最拥挤，更容易被跳过）
    - cron: "7,27,47 * * * *"
  push:
    branches: [main]
  workflow_dispatch:          # 允许在网页上手动点"Run workflow"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 保活：仓库 60 天没有提交时，GitHub 会自动停用定时任务。
  # 每次运行都重新"启用"一次，计时就永远走不到 60 天。和生成网页互不影响。
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: 保持定时任务启用
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: 运行 Python 测试
        run: pytest -q

      - name: 运行网页脚本测试
        run: node --test

      - name: 生成网页
        run: python build.py
        env:
          ICS_URL: ${{ secrets.ICS_URL }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
